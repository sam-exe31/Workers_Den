spring.application.name=Workers_Backend_Services

# Default to the "local" profile so a plain run (IntelliJ ▶, mvnw, java -jar) picks
# up application-local.properties. On Render, set SPRING_PROFILES_ACTIVE=prod (or
# leave it — the base env vars below still resolve since no local file is deployed).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=10000

server.port=${PORT:8080}

server.compression.enabled=true
server.compression.mime-types=application/json,text/html


management.endpoints.web.exposure.include=health,metrics
spring.jpa.open-in-view=false


cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}