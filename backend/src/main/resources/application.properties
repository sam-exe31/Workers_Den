spring.application.name=Workers_Backend_Services

# --- Datasource ---
# Local dev: with no env vars set, this connects to a local MySQL at
#   localhost:3306, database "workers_den", user "root", empty password.
#   Override MYSQLHOST/MYSQLPORT/MYSQLDATABASE/MYSQLUSER/MYSQLPASSWORD (or set
#   SPRING_DATASOURCE_URL to a full JDBC URL) to point somewhere else.
# Render/prod: the MYSQL* env vars are already set there and override these
#   defaults; Aiven's SSL is negotiated automatically (driver default sslMode=PREFERRED).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:workers_den}?allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=10000

server.port=${PORT:8080}

server.compression.enabled=true
server.compression.mime-types=application/json,text/html


management.endpoints.web.exposure.include=health,metrics
spring.jpa.open-in-view=false


cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}